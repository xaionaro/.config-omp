modelRoles:
  default: openai-codex/gpt-6.2-sol:low
  smol: openai-codex/gpt-6-luna:low
  slow: openai-codex/gpt-6.2-sol:xhigh
  advisor: anthropic/claude-opus-5-5:low
  cross-review: anthropic/claude-opus-5-5:medium
modelPresets:
  claude:
    modelRoles:
      default: anthropic/claude-opus-5-5:low
      smol: anthropic/claude-haiku-5-5:low
      slow: anthropic/claude-opus-5-5:xhigh
      advisor: openai-codex/gpt-6.2-sol:low
      cross-review: openai-codex/gpt-6.2-sol:medium
    defaultThinkingLevel: low
  openai:
    modelRoles:
      default: openai-codex/gpt-6.2-sol:low
      smol: openai-codex/gpt-6-luna:low
      slow: openai-codex/gpt-6.2-sol:xhigh
      advisor: anthropic/claude-opus-5-5:low
      cross-review: anthropic/claude-opus-5-5:medium
    defaultThinkingLevel: medium
symbolPreset: nerd
composer:
  shape: band
theme:
  dark: titanium
  light: light
update:
  auto: false
setupVersion: 3
extendedContext: false
task:
  perCallModel: "on"
  softRequestBudget: 0
  agentSoftRequestBudget: {}
  agentIdleTtlMs: 3600000
defaultThinkingLevel: medium
advisor:
  enabled: true
dev:
  autoqaConsent: denied
tui:
  completeScrollback: true
statusLine:
  preset: custom
  separator: powerline
  leftSegments:
    - pi
    - vim
    - model
    - mode
    - path
    - git
    - pr
    - subagents
  rightSegments:
    - session_name
    - usage
    - token_rate
    - cost
    - context_pct
    - context_total
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 12
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
providers:
  anthropic:
    slowMode: auto
bash:
  gitGuard: true
lsp:
  diagnosticsOnEdit: true
  formatOnWrite: true
retry:
  waitForUsageReset: false
  fallbackChains:
    default:
      - openai-codex/gpt-6.2-sol:low
    slow:
      - openai-codex/gpt-6.2-sol:xhigh
    anthropic/claude-opus-5-5:low:
      - openai-codex/gpt-6.2-sol:low
    anthropic/claude-opus-5-5:medium:
      - openai-codex/gpt-6.2-sol:medium
    anthropic/claude-opus-5-5:xhigh:
      - openai-codex/gpt-6.2-sol:xhigh
    anthropic/claude-haiku-5-5:
      - openai-codex/gpt-6-luna:low
    openai-codex/gpt-6-luna:
      - anthropic/claude-haiku-5-5:low
    openai-codex/gpt-6.2-sol:low:
      - anthropic/claude-opus-5-5:low
    openai-codex/gpt-6.2-sol:
      - anthropic/claude-opus-5-5
secrets:
  enabled: true
autoResume: true
hideThinkingBlock: false
disabledProviders:
  - opencode-zen
auth:
  accountPolicies:
    - provider: openai-codex
      account:
        email: gpt@danusya.net
      priority: 3
    - provider: openai-codex
      account:
        email: pheonallm3@gmail.com
      priority: 2
    - provider: openai-codex
      account:
        email: xaionaro@gmail.com
      priority: 1
    - provider: anthropic
      account:
        email: pheonallm3@gmail.com
      priority: 3
    - provider: anthropic
      account:
        email: xaionaro@gmail.com
      priority: 2
    - provider: anthropic
      account:
        email: admin@danusya.net
      priority: 1
codexResets:
  autoRedeem5h: unset
  autoRedeemWeekly: "no"
commit:
  enabled: false