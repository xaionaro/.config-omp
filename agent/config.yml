modelRoles:
  eci-max: anthropic/claude-opus-5-5
  default: anthropic/claude-opus-5-5:low
  smol: anthropic/claude-haiku-5-5:low
  slow: anthropic/claude-opus-5-5:xhigh
  advisor: openai-codex/gpt-6.1-terra:medium
# Two interchangeable sets; switch with /modelpreset switch <name>.
# Each preset gives the advisor the other provider's model.
modelPresets:
  claude:
    modelRoles:
      eci-max: anthropic/claude-opus-5-5
      default: anthropic/claude-opus-5-5:low
      smol: anthropic/claude-haiku-5-5:low
      slow: anthropic/claude-opus-5-5:xhigh
      advisor: openai-codex/gpt-6.1-terra:medium
    defaultThinkingLevel: low
  openai:
    modelRoles:
      eci-max: openai-codex/gpt-6.1-sol:medium
      default: openai-codex/gpt-6.1-terra:medium
      smol: anthropic/claude-haiku-5-5:low
      slow: openai-codex/gpt-6.1-sol:xhigh
      advisor: anthropic/claude-opus-5-5:low
    defaultThinkingLevel: medium
symbolPreset: nerd
composer:
  shape: band
theme:
  dark: titanium
  light: light
update:
  auto: false
setupVersion: 3
extendedContext: false
task:
  perCallModel: "on"
  # ECI camp models (eci/model-selection.yaml) usable as per-call task models.
  perCallModelAllow:
    - anthropic/claude-opus-5-5:low
    - anthropic/claude-opus-5-5:medium
    - anthropic/claude-opus-5-5:xhigh
    - openai-codex/gpt-6.1-terra:medium
    - openai-codex/gpt-6.1-sol:medium
    - openai-codex/gpt-6.1-sol:xhigh
  softRequestBudget: 0
  agentSoftRequestBudget: {}
defaultThinkingLevel: low
advisor:
  enabled: true
dev:
  autoqaConsent: denied
tui:
  completeScrollback: true
statusLine:
  preset: custom
  separator: powerline
  leftSegments:
    - pi
    - vim
    - model
    - mode
    - path
    - git
    - pr
    - subagents
  rightSegments:
    - session_name
    - usage
    - token_rate
    - cost
    - context_pct
    - context_total
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 12
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
providers:
  anthropic:
    slowMode: auto
bash:
  gitGuard: true
lsp:
  diagnosticsOnEdit: true
  formatOnWrite: true
retry:
  waitForUsageReset: true
  # Automatic switch on provider failure or usage limit, both directions.
  # Role keys: Claude tiers -> GPT 6.1. Model keys (win over role keys):
  # GPT 6.1 -> Opus; bare sol entry keeps the failing effort (medium/xhigh).
  fallbackChains:
    default: [openai-codex/gpt-6.1-terra:medium]
    eci-max: [openai-codex/gpt-6.1-sol:medium]
    slow: [openai-codex/gpt-6.1-sol:xhigh]
    openai-codex/gpt-6.1-terra: [anthropic/claude-opus-5-5:low]
    openai-codex/gpt-6.1-sol: [anthropic/claude-opus-5-5]
secrets:
  enabled: true
autoResume: true