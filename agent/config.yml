modelRoles:
  eci-max: anthropic/claude-opus-5-5
  default: anthropic/claude-opus-5-5:low
symbolPreset: nerd
composer:
  shape: band
theme:
  dark: titanium
  light: light
update:
  auto: false
setupVersion: 3
extendedContext: false
task:
  perCallModel: "on"
  softRequestBudget: 0
  agentSoftRequestBudget: {}
defaultThinkingLevel: low
advisor:
  enabled: true
dev:
  autoqaConsent: denied
tui:
  completeScrollback: true
statusLine:
  preset: custom
  separator: powerline
  leftSegments:
    - pi
    - vim
    - model
    - mode
    - path
    - git
    - pr
    - subagents
  rightSegments:
    - session_name
    - usage
    - token_rate
    - cost
    - context_pct
    - context_total
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 6
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
providers:
  anthropic:
    slowMode: auto
bash:
  gitGuard: true
lsp:
  diagnosticsOnEdit: true
  formatOnWrite: true
retry:
  waitForUsageReset: true