modelRoles:
  eci-max: anthropic/claude-opus-5-5
  default: anthropic/claude-opus-5-5:low
symbolPreset: nerd
composer:
  shape: band
theme:
  dark: titanium
  light: light
update:
  auto: false
setupVersion: 3
extendedContext: false
task:
  perCallModel: "on"
  softRequestBudget: 0
  agentSoftRequestBudget: {}
defaultThinkingLevel: low
advisor:
  enabled: true
dev:
  autoqaConsent: denied
tui:
  completeScrollback: true
statusLine:
  preset: custom
  separator: powerline
  leftSegments: [pi, vim, hostname, model, mode, path, git, pr, session, subagents]
  rightSegments: [session_name, usage, token_in, token_out, cache_read, cache_write, token_rate, cache, cost, context_pct, context_total, time_spent, time]
  segmentOptions:
    model: { showThinkingLevel: true }
    path: { abbreviate: true, maxLength: 60 }
    git: { showBranch: true, showStaged: true, showUnstaged: true, showUntracked: true }
    time: { format: "24h", showSeconds: true }