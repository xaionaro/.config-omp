modelRoles:
  default: anthropic/claude-opus-5-5:low
  smol: anthropic/claude-haiku-5-5:low
  slow: anthropic/claude-opus-5-5:xhigh
  advisor: openai-codex/gpt-6.1-terra:medium
  # Grants the opposite provider's ECI critic model for per-call task spawns
  # (task.perCallModel only accepts models some role names).
  cross-review: openai-codex/gpt-6.1-sol:medium
# Two interchangeable sets; switch with /modelpreset switch <name>.
# Each preset gives the advisor and cross-review the other provider's model.
modelPresets:
  claude:
    modelRoles:
      default: anthropic/claude-opus-5-5:low
      smol: anthropic/claude-haiku-5-5:low
      slow: anthropic/claude-opus-5-5:xhigh
      advisor: openai-codex/gpt-6.1-terra:medium
      cross-review: openai-codex/gpt-6.1-sol:medium
    defaultThinkingLevel: low
  openai:
    modelRoles:
      default: openai-codex/gpt-6.1-terra:medium
      smol: openai-codex/gpt-6-luna:low
      slow: openai-codex/gpt-6.1-sol:xhigh
      advisor: anthropic/claude-opus-5-5:low
      cross-review: anthropic/claude-opus-5-5:medium
    defaultThinkingLevel: medium
symbolPreset: nerd
composer:
  shape: band
theme:
  dark: titanium
  light: light
update:
  auto: false
setupVersion: 3
extendedContext: false
task:
  perCallModel: "on"
  softRequestBudget: 0
  agentSoftRequestBudget: {}
defaultThinkingLevel: low
advisor:
  enabled: true
dev:
  autoqaConsent: denied
tui:
  completeScrollback: true
statusLine:
  preset: custom
  separator: powerline
  leftSegments:
    - pi
    - vim
    - model
    - mode
    - path
    - git
    - pr
    - subagents
  rightSegments:
    - session_name
    - usage
    - token_rate
    - cost
    - context_pct
    - context_total
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 12
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
providers:
  anthropic:
    slowMode: auto
bash:
  gitGuard: true
lsp:
  diagnosticsOnEdit: true
  formatOnWrite: true
retry:
  waitForUsageReset: true
  # Automatic switch on provider failure or usage limit, both directions.
  # Role keys: Claude tiers -> GPT 6.1. Model keys (win over role keys):
  # GPT 6.1 -> Opus; bare sol entry keeps the failing effort (medium/xhigh).
  fallbackChains:
    default: [openai-codex/gpt-6.1-terra:medium]
    slow: [openai-codex/gpt-6.1-sol:xhigh]
    anthropic/claude-haiku-5-5: [openai-codex/gpt-6-luna:low]
    openai-codex/gpt-6-luna: [anthropic/claude-haiku-5-5:low]
    openai-codex/gpt-6.1-terra: [anthropic/claude-opus-5-5:low]
    openai-codex/gpt-6.1-sol: [anthropic/claude-opus-5-5]
secrets:
  enabled: true
autoResume: true