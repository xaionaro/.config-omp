#model = "qwen3.8:27b-mlx"
#model_provider = "ollama"
#model_reasoning_effort = "xhigh"
#oss_provider = "ollama"
model = "gpt-6.1-terra"
model_reasoning_effort = "low"
#model = "flint"
#model_provider = "flint"
#review_model = "flint"
#model_reasoning_effort = "low"
approval_policy = "never"
sandbox_mode = "danger-full-access"
developer_instructions = """
Also follow `$HOME/.omp/agent/eci/AGENTS.md` as user-level guidance when it does not conflict with higher-priority ECI instructions.
Ported skills live in `$HOME/.omp/agent/eci/skills`; use matching skills for Go, Python, tests, debugging, UI, Android, porting, skill/prompt work, and explicit delegated-agent work.
"""
service_tier = "default"

[features]
api_key_model_discovery = true
auth_elicitation = true
code_mode_host = true
mcp_oauth_refresh_coordination = false
hooks = false
image_generation = false
multi_agent = true
multi_agent_v2 = true

[agents]
max_concurrent_threads_per_session = 64

[history]
persistence = "none"
max_bytes = 0

[analytics]
enabled = false

[otel]
log_user_prompt = false

[mcp_servers.context7]
enabled = false
command = "bash"
args = ["-lc", "exec \"$HOME/.omp/agent/eci/bin/context7-mcp\""]

[mcp_servers.omx_state]
command = "omx"
args = ["mcp-serve", "state"]
enabled = false
startup_timeout_sec = 5.0

[mcp_servers.omx_memory]
command = "omx"
args = ["mcp-serve", "memory"]
enabled = false
startup_timeout_sec = 5.0

[mcp_servers.omx_code_intel]
command = "omx"
args = ["mcp-serve", "code-intel"]
enabled = false
startup_timeout_sec = 10.0

[mcp_servers.omx_trace]
command = "omx"
args = ["mcp-serve", "trace"]
enabled = false
startup_timeout_sec = 5.0

[mcp_servers.omx_wiki]
command = "omx"
args = ["mcp-serve", "wiki"]
enabled = false
startup_timeout_sec = 5.0

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[notice]
hide_rate_limit_model_nudge = true

[notice.model_migrations]
"hf.co/xaionaro/qwen38-fcf-gguf:Q4_K_M" = "gpt-6-sol"

[tui]
status_line = ["model-with-reasoning", "git-branch", "total-input-tokens", "total-output-tokens", "five-hour-limit", "weekly-limit", "context-used", "context-window-size", "thread-credits", "estimated-thread-cost", "thread-id", "thread-name"]
